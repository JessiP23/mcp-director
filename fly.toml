# fly.toml app configuration file generated for mcp-director on 2026-05-07T19:00:42-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mcp-director'
primary_region = 'ewr'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Keep 1 machine warm so Fly's proxy does not hit a cold start on every MCP request.
  # Set min_machines_running = 0 only if you accept ~5–15s cold starts and occasional
  # "connection refused" until the process is listening.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "20s"
    timeout = "10s"
    grace_period = "60s"
    method = "GET"
    path = "/health"
    protocol = "http"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
